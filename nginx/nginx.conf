# ==============================================================================
# Configuración Nginx Enterprise para SYSCOM-GAZA (Producción)
# SecOps & DevOps Standards: HSTS, Headers Estrictos, Limit Payload & Reverse Proxy
# ==============================================================================

# Definición de Upstream para el Backend Node.js / Express
upstream nodejs_backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name syscomgaza.com www.syscomgaza.com;

    # Redirección automática de HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name syscomgaza.com www.syscomgaza.com;

    # Certificados SSL / TLS
    ssl_certificate /etc/letsencrypt/live/syscomgaza.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syscomgaza.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --------------------------------------------------------------------------
    # 🔒 SECOPS: CABECERAS DE SEGURIDAD ESTRICTAS Y LIMITACIÓN DE PAYLOAD
    # --------------------------------------------------------------------------

    # Limitación del tamaño máximo del cuerpo HTTP (Protección contra bombas de payload / DoS)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # 1. HSTS (HTTP Strict Transport Security): Forzar HTTPS por 1 año incluyendo subdominios
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 2. Protección contra Clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 3. Protección contra MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # 4. Filtro XSS del navegador (legacy fallback)
    add_header X-XSS-Protection "1; mode=block" always;

    # 5. Política de Referrer segura
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 6. Content Security Policy (CSP) baseline
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.stripe.com https://developers.syscom.mx https://*.sentry.io; frame-src 'self' https://js.stripe.com;" always;

    # --------------------------------------------------------------------------
    # ⚡ OPTIMIZACIÓN GZIP & ASSETS ESTÁTICOS
    # --------------------------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # Raíz del Frontend React (Build estático de Vite)
    root /var/www/gaza;
    index index.html;

    # Enrutamiento SPA de React (Fallback a index.html para React Router)
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Cache agresiva para Assets inmutables (JS, CSS, Imágenes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # 🚀 REVERSE PROXY HACIA BACKEND NODE.JS (/api)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;

        # Preservar headers de conexión y cliente real (Para Rate-Limiter y Logs)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts estrictos de Proxy (4s acorde a SLAs de integración)
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Bloqueo de acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
