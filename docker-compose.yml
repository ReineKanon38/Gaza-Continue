version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: gaza_backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      SYSCOM_API_URL: ${SYSCOM_API_URL:-https://developers.syscom.mx/api/v1}
      SYSCOM_CLIENT_ID: ${SYSCOM_CLIENT_ID}
      SYSCOM_API_KEY: ${SYSCOM_API_KEY}
      SYSCOM_DEFAULT_QUERY: ${SYSCOM_DEFAULT_QUERY:-camara}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: gaza_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
